<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林業保育署執行成果</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  /* 和色 Japanese color tokens */
  --kon:#1c2c40;         /* 紺色 深藍夜幕 */
  --kon-2:#233650;
  --washi:#f3ecd9;       /* 生成り washi paper */
  --washi-2:#e9dfc4;
  --sumi:#2a271f;        /* 墨 ink */
  --shu:#c1442c;         /* 朱色 vermillion / hanko */
  --shu-dark:#8f2f1e;
  --kincha:#c19a4b;      /* 金茶 gold */
  --matsuba:#5c7a52;     /* 松葉色 pine — 保育管理組 */
  --mizu:#5f93a6;        /* 水色 — 森林育樂組 */
  --kaki:#c17a3f;        /* 柿色 — 森林產業組 */
  --fuji:#8577a3;        /* 藤色 — 保育企劃組 */
  --nando:#4a7c85;       /* 納戶色 — 集水區治理組 */
  --beniger:#9c4b3a;     /* 紅柄色 — 森林管理組 */
  --radius:2px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 1px 1px, rgba(243,236,217,0.05) 1px, transparent 0) 0 0/26px 26px,
    linear-gradient(160deg,#141f2f 0%, var(--kon) 45%, var(--kon-2) 100%);
  font-family:'Noto Sans TC', sans-serif;
  color:var(--washi);
  padding:0 0 90px;
  overflow-x:hidden;
}

/* ---------- masthead ---------- */
.masthead{
  max-width:1240px;
  margin:0 auto;
  padding:56px clamp(20px,4vw,40px) 0;
  opacity:0;
  animation:riseIn .7s ease forwards;
}
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  letter-spacing:.24em;
  color:var(--kincha);
  text-transform:uppercase;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow::before{
  content:"";
  width:22px;height:1px;
  background:var(--kincha);
  display:inline-block;
}
h1{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:clamp(30px, 4.4vw, 48px);
  margin:0 0 14px;
  line-height:1.35;
  letter-spacing:.04em;
}
.masthead p{
  font-size:14.5px;
  color:#d6cdb2;
  line-height:1.85;
  max-width:640px;
  margin:0;
}
.src{
  margin-top:18px;
  font-family:'JetBrains Mono', monospace;
  font-size:11.5px;
  color:#9caebd;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.refresh-btn{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:var(--kincha);
  background:transparent;
  border:1px solid rgba(193,154,75,.5);
  border-radius:20px;
  padding:4px 14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.refresh-btn:hover{ background:rgba(193,154,75,.12); }
.refresh-btn:disabled{ opacity:.5; cursor:default; }
.refresh-btn .spin{
  display:inline-block;
  width:10px;height:10px;
  border-radius:50%;
  border:2px solid rgba(193,154,75,.35);
  border-top-color:var(--kincha);
  animation:spin .8s linear infinite;
  visibility:hidden;
}
.refresh-btn.loading .spin{ visibility:visible; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.sync-status{ color:#9caebd; }
.sync-status.ok{ color:#8fae8f; }
.sync-status.err{ color:#d19a86; }

/* seigaiha trim — thin decorative wave rule */
.seigaiha{
  max-width:1240px;
  margin:32px auto 0;
  padding:0 clamp(20px,4vw,40px);
}
.seigaiha i{
  display:block;
  height:14px;
  background-image: repeating-radial-gradient(circle at 0 100%, transparent 0, transparent 6px, rgba(193,154,75,.35) 7px, transparent 8px);
  background-size: 24px 24px;
  background-position: 0 100%;
  opacity:.7;
}

/* ---------- hero card ---------- */
.hero-wrap{
  max-width:1240px;
  margin:36px auto 0;
  padding:0 clamp(20px,4vw,40px);
  opacity:0;
  animation:riseIn .7s ease forwards;
  animation-delay:.1s;
}
.hero{
  position:relative;
  background:var(--washi);
  color:var(--sumi);
  border-radius:var(--radius);
  padding:clamp(28px,4vw,44px) clamp(28px,5vw,48px) 32px;
  box-shadow:0 24px 44px -20px rgba(0,0,0,.6);
  border-left:6px solid var(--shu);
}
.hero::after{
  content:"";
  position:absolute;
  inset:10px;
  border:1px dashed rgba(42,39,31,.16);
  pointer-events:none;
}
.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:6px;
}
.hero-tag{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:.14em;
  color:var(--matsuba);
  background:rgba(92,122,82,0.1);
  border:1px solid rgba(92,122,82,0.35);
  padding:4px 10px;
  border-radius:20px;
}
.hanko{
  width:66px;height:66px;
  border:2.5px solid var(--shu);
  border-radius:50%;
  color:var(--shu);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:12px;
  line-height:1.3;
  letter-spacing:.05em;
  transform:rotate(-6deg);
  opacity:.9;
  flex-shrink:0;
  writing-mode:vertical-rl;
}
.hero-label{
  font-family:'Noto Serif TC', serif;
  font-size:16px;
  font-weight:700;
  color:var(--matsuba);
  margin:14px 0 4px;
}
.hero-number{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:clamp(48px, 8.5vw, 92px);
  line-height:1;
  letter-spacing:-.01em;
  display:flex;
  align-items:baseline;
  gap:10px;
  color:var(--sumi);
}
.hero-number .unit{
  font-family:'Noto Sans TC', sans-serif;
  font-size:22px;
  font-weight:700;
  color:var(--shu-dark);
}
.hero-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid var(--washi-2);
  flex-wrap:wrap;
  gap:10px;
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  color:#6c6650;
}
.hero-foot a{
  color:var(--shu-dark);
  text-decoration:none;
  border-bottom:1px solid currentColor;
}
.hero-foot a:hover{ color:var(--shu); }

/* ---------- sections ---------- */
.section{
  max-width:1240px;
  margin:48px auto 0;
  padding:0 clamp(20px,4vw,40px);
  opacity:0;
}
.section.show{ animation:riseIn .6s ease forwards; }

.section-body{
  display:flex;
  gap:18px;
  align-items:stretch;
}
.section-tag{
  flex:0 0 auto;
  width:46px;
  border-radius:var(--radius);
  background:var(--tag-color, var(--matsuba));
  color:var(--washi);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 0;
  writing-mode:vertical-rl;
  text-orientation:upright;
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:.18em;
  gap:14px;
}
.section-tag .count{
  writing-mode:horizontal-tb;
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  letter-spacing:0;
  opacity:.85;
  margin-top:8px;
}
.section-cards{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
}

@media (min-width:1500px){
  .section-cards{ grid-template-columns:repeat(5, 1fr); }
}
@media (max-width:1099px){
  .section-cards{ grid-template-columns:repeat(3, 1fr); }
}
@media (max-width:759px){
  .section-cards{ grid-template-columns:repeat(2, 1fr); }
}
@media (max-width:639px){
  .section-body{ flex-direction:column; }
  .section-tag{
    width:100%;
    writing-mode:horizontal-tb;
    flex-direction:row;
    justify-content:flex-start;
    gap:10px;
    padding:10px 16px;
    letter-spacing:.1em;
  }
  .section-tag .count{ margin-top:0; margin-left:auto; }
}
@media (max-width:420px){
  .section-cards{ grid-template-columns:1fr; }
}

/* ---------- flashcards ---------- */
.card{
  perspective:1400px;
  height:200px;
}
.card-inner{
  position:relative;
  width:100%; height:100%;
  transition:transform .6s cubic-bezier(.2,.7,.3,1);
  transform-style:preserve-3d;
  cursor:pointer;
}
.card.flipped .card-inner{ transform:rotateY(180deg); }

.face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  border-radius:var(--radius);
  padding:18px 18px 16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.face-front{
  background:var(--washi);
  color:var(--sumi);
  box-shadow:0 14px 26px -16px rgba(0,0,0,.55);
  justify-content:space-between;
  border-left:4px solid var(--accent, var(--matsuba));
}
.card-label{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:13.5px;
  line-height:1.5;
  color:#3c3527;
  margin-bottom:10px;
}
.card-number{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:clamp(22px, 3vw, 28px);
  display:flex;
  align-items:baseline;
  gap:6px;
  color:var(--sumi);
}
.card-number .unit{
  font-size:12.5px;
  font-weight:700;
  color:var(--shu-dark);
  font-family:'Noto Sans TC', sans-serif;
}
.card-hint{
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  color:#9c8f68;
  letter-spacing:.05em;
  align-self:flex-end;
  margin-top:8px;
}

.face-back{
  background:var(--accent, var(--matsuba));
  color:var(--washi);
  transform:rotateY(180deg);
  justify-content:space-between;
  box-shadow:0 14px 26px -16px rgba(0,0,0,.55);
}
.back-title{
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(243,236,217,.75);
}
.back-body{
  font-size:11.8px;
  line-height:1.65;
  color:var(--washi);
  overflow-y:auto;
  flex:1 1 auto;
  margin:6px 0;
}
.back-body a{ color:var(--kincha); }
.back-row{
  display:flex;
  justify-content:space-between;
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:rgba(243,236,217,.85);
  padding-top:8px;
  border-top:1px solid rgba(243,236,217,.25);
}

footer{
  max-width:1240px;
  margin:56px auto 0;
  padding:0 clamp(20px,4vw,40px);
  text-align:center;
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:#7e8fa0;
  opacity:0;
}
footer.show{ animation:riseIn .6s ease forwards; }

@keyframes riseIn{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  .masthead,.hero-wrap,.section,footer{ opacity:1 !important; }
}

.card-inner:focus-visible{
  outline:2px solid var(--kincha);
  outline-offset:4px;
}
</style>
</head>

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 自動把備註文字裡的網址轉成可點連結
function autoLink(escapedText){
  return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function linkify(note, url){
  const safe = escapeHtml(note || '');
  let html = autoLink(safe);
  if(url && !(note || '').includes(url)){
    html += `${html ? '<br>' : ''}<a href="${url}" target="_blank" rel="noopener">查看更多 →</a>`;
  }
  return html || '此項目暫無備註。';
}

function rocDateToWestern(raw){
  const s = String(raw ?? '').trim();
  if(!/^\d{6,7}$/.test(s)) return s || '—';
  const yy = s.length === 7 ? s.slice(0,3) : s.slice(0,2);
  const mm = s.length === 7 ? s.slice(3,5) : s.slice(2,4);
  const dd = s.length === 7 ? s.slice(5,7) : s.slice(4,6);
  return `${parseInt(yy,10) + 1911}.${mm}.${dd}`;
}

function formatNumber(raw){
  const s = String(raw ?? '').trim();
  const cleaned = s.replace(/,/g, '');
  if(cleaned === '' || isNaN(Number(cleaned))) return s;
  const num = Number(cleaned);
  return Number.isInteger(num) ? num.toLocaleString('en-US') : num.toLocaleString('en-US', { maximumFractionDigits:2 });
}

const sectionsEl = document.getElementById('sections');

function renderAll(){
  sectionsEl.innerHTML = '';

  const groupMap = {};
  DATA.forEach(item => {
    if(!(item.division in groupMap)) groupMap[item.division] = [];
    groupMap[item.division].push(item);
  });
  GROUP_ORDER.forEach(div => { if(!groupMap[div]) return; });
  // 確保新出現、未列在 GROUP_ORDER 的組別也會顯示（排在最後）
  Object.keys(groupMap).forEach(div => { if(!GROUP_ORDER.includes(div)) GROUP_ORDER.push(div); });

  const groups = GROUP_ORDER.filter(div => groupMap[div]).map(div => ({ division:div, items:groupMap[div] }));

  groups.forEach((group, gi) => {
    const section = document.createElement('div');
    section.className = 'section';
    const accent = ACCENT_MAP[group.division] || 'var(--matsuba)';

    const cardsHtml = group.items.map(item => `
      <div class="card" tabindex="0">
        <div class="card-inner">
          <div class="face face-front" style="--accent:${accent}">
            <div>
              <div class="card-label">${escapeHtml(item.name)}</div>
              <div class="card-number">${escapeHtml(item.value)}<span class="unit">${escapeHtml(item.unit)}</span></div>
            </div>
            <div class="card-hint">點按翻面 ›</div>
          </div>
          <div class="face face-back" style="--accent:${accent}">
            <div class="back-title">Field Note</div>
            <div class="back-body">${linkify(item.note, item.url)}</div>
            <div class="back-row"><span>更新日期</span><span>${escapeHtml(item.date)}</span></div>
          </div>
        </div>
      </div>`).join('');

    section.innerHTML = `
      <div class="section-body">
        <div class="section-tag" style="--tag-color:${accent}">
          <span>${escapeHtml(group.division)}</span>
          <span class="count">${group.items.length}</span>
        </div>
        <div class="section-cards">${cardsHtml}</div>
      </div>`;

    sectionsEl.appendChild(section);
    section.style.animationDelay = `${0.1 + gi * 0.06}s`;
    requestAnimationFrame(() => section.classList.add('show'));

    section.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => card.classList.toggle('flipped'));
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.classList.toggle('flipped'); }
      });
    });
  });

  document.getElementById('footer').classList.add('show');
}

renderAll();

/* ---------- 即時重新抓取（需在瀏覽器中開啟本檔案才會生效，Claude 預覽沙盒會擋外部連線） ---------- */
const SHEET_ID = "1R2aWDNvycu9KmBiUouIIXfI7ROUv9x8qwmUEKpuvZcY";

function loadViaJsonp(){
  return new Promise((resolve, reject) => {
    const cbName = 'gsheetCB_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('連線逾時')); }, 12000);
    function cleanup(){
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    window[cbName] = (response) => { cleanup(); resolve(response); };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}`;
    script.onerror = () => { cleanup(); reject(new Error('無法連線到試算表（網路或分享權限問題）')); };
    document.body.appendChild(script);
  });
}

function gvizToItems(response){
  if(!response || !response.table) throw new Error('回傳格式異常');
  const rows = response.table.rows || [];
  const cellAt = (row, idx) => {
    const c = row.c && row.c[idx];
    if(!c) return '';
    return (c.f !== undefined && c.f !== null && String(c.f).trim() !== '') ? c.f : (c.v ?? '');
  };
  return rows
    .map(r => ({
      name: String(cellAt(r,0)).trim(),
      value: formatNumber(cellAt(r,1)),
      unit: String(cellAt(r,2)).trim(),
      date: rocDateToWestern(r.c && r.c[3] ? r.c[3].v : ''),
      division: String(cellAt(r,4)).trim(),
      note: String(cellAt(r,5) ?? '').trim(),
    }))
    .filter(item => item.name !== '');
}

const refreshBtn = document.getElementById('refresh-btn');
const refreshLabel = document.getElementById('refresh-label');
const syncStatus = document.getElementById('sync-status');

refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  refreshBtn.classList.add('loading');
  refreshLabel.textContent = '讀取中…';
  syncStatus.className = 'sync-status';
  syncStatus.textContent = '正在連線至試算表 …';

  try{
    const response = await loadViaJsonp();
    const fetched = gvizToItems(response);
    if(!fetched.length) throw new Error('讀到的資料是空的');

    // 依「組別＋項目名稱」比對，有則更新、沒有則新增
    fetched.forEach(newItem => {
      const existing = DATA.find(d => d.division === newItem.division && d.name === newItem.name);
      if(existing){
        existing.value = newItem.value;
        existing.unit = newItem.unit;
        existing.date = newItem.date;
        existing.note = newItem.note;
      } else {
        DATA.push(newItem);
      }
    });

    renderAll();
    const now = new Date();
    syncStatus.classList.add('ok');
    syncStatus.textContent = `已同步 · ${now.toLocaleTimeString('zh-TW', { hour12:false })}`;
  }catch(err){
    syncStatus.classList.add('err');
    syncStatus.textContent = `讀取失敗（${err.message}）— 若在 Claude 預覽視窗中屬正常現象，請下載後於瀏覽器開啟再試`;
  }finally{
    refreshBtn.disabled = false;
    refreshBtn.classList.remove('loading');
    refreshLabel.textContent = '重新抓取資料';
  }
});
</script>
